<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Pages</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="wordmark">AI Pages</p>
            <button type="button" class="icon-button" id="settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m10 3-.6 2.3-1.7 1-2.3-.7-2 3.5 1.8 1.6v2l-1.8 1.6 2 3.5 2.3-.7 1.7 1 .6 2.3h4l.6-2.3 1.7-1 2.3.7 2-3.5-1.8-1.6v-2l1.8-1.6-2-3.5-2.3.7-1.7-1L14 3z"/>
                    <circle cx="12" cy="11.7" r="2.8"/>
                </svg>
            </button>
        </header>
        <h1>Your tools</h1>
        <ul id="services" class="tiles" aria-label="Downloaded tools"></ul>
        <p id="status" class="status" role="status">Loading tools…</p>
    </main>
</body>
</html>
