name: Android APK

on:
  push:
    paths-ignore: ['feed/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;35.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: bash tests/check-java.sh
      - run: python3 -m unittest discover -s tests -p test_publish_catalog.py
      - run: gradle --no-daemon lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ai-pages-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
