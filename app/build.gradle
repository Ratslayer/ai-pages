plugins {
    id 'com.android.application' version '8.13.0'
}
def updateKeystore = System.getenv('AI_PAGES_ANDROID_KEYSTORE')
def updatePassword = System.getenv('AI_PAGES_ANDROID_KEYSTORE_PASSWORD')

android {
    namespace 'app.aipages'
    compileSdk 36

    defaultConfig {
        applicationId 'app.aipages'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
    }
    if (updateKeystore) {
        signingConfigs {
            debug {
                storeFile file(updateKeystore)
                storeType 'PKCS12'
                storePassword updatePassword
                keyAlias 'ai-pages'
                keyPassword updatePassword
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
