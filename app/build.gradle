plugins {
    id 'com.android.application' version '8.13.0'
}
def updateKeystore = System.getenv('AI_PAGES_ANDROID_KEYSTORE')
def updatePassword = System.getenv('AI_PAGES_ANDROID_KEYSTORE_PASSWORD')

android {
    namespace 'app.aipages'
    compileSdk 36

    defaultConfig {
        applicationId 'app.aipages'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 28
        targetSdk 36
        versionCode 10
        versionName '0.2.3'
    }
    if (updateKeystore) {
        signingConfigs {
            debug {
                storeFile file(updateKeystore)
                storeType 'PKCS12'
                storePassword updatePassword
                keyAlias 'ai-pages'
                keyPassword updatePassword
            }
        }
    }
    testOptions.unitTests.includeAndroidResources = true
    testOptions.unitTests.all {
        systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

def ocrAssets = layout.buildDirectory.dir('generated/ocrAssets')
android.sourceSets.main.assets.srcDir(ocrAssets)
def prepareOcrModels = tasks.register('prepareOcrModels') {
    def revision = '87416418657359cb625c412a48b6e1d6d41c29bd'
    def languages = 'eng deu fra rus spa ita por nld swe pol ukr tur ara heb hin jpn chi_sim kor'.split(' ')
    inputs.property('revision', revision)
    inputs.property('languages', languages.join(' '))
    outputs.dir(ocrAssets)
    doLast {
        def dir = new File(ocrAssets.get().asFile, 'ocr')
        dir.mkdirs()
        (languages.collect { it + '.traineddata' } + ['LICENSE']).each { name ->
            def target = new File(dir, name)
            def source = new URL("https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/${revision}/${name}")
            source.withInputStream { input -> target.withOutputStream { it << input } }
        }
    }
}
tasks.named('preBuild').configure { dependsOn prepareOcrModels }
